<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Voxel Garden</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
body{overflow:hidden;background:#000}
#c{width:100vw;height:100vh;display:block}

:root{
  --g-bg:    rgba(255,255,255,.16);
  --g-bg2:   rgba(255,255,255,.26);
  --g-border:rgba(255,255,255,.4);
  --g-shadow:0 8px 32px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.45);
  --g-ink:   rgba(35,28,26,.88);    /* dark warm text — for use ON light glass pills */
  --g-ink2:  rgba(255,255,255,.72); /* light text — for use on the scene backdrop directly */
  --g-ink3:  rgba(255,255,255,.42);
  --g-green: #58c462;
  --mono:    'SF Mono','Fira Mono','Consolas',monospace;
  --r:       50px;
  --bar-w:   min(580px, calc(100vw - 32px));
  --bar-bot: max(28px, env(safe-area-inset-bottom, 28px));
}

/* ── Time badge — purely informational, not clickable ── */
#time-badge{
  position:fixed;top:16px;left:50%;transform:translateX(-50%);
  background:rgba(255,255,255,.14);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
  border:1px solid rgba(255,255,255,.28);border-radius:24px;
  padding:5px 16px;font-size:10px;color:var(--g-ink2);
  pointer-events:none;cursor:default;letter-spacing:.06em;z-index:500;
  white-space:nowrap;font-family:var(--mono);
  text-shadow:0 1px 3px rgba(0,0,0,.28);
  max-width:calc(100vw - 120px);overflow:hidden;text-overflow:ellipsis;text-align:center;
}

/* ── Unified layout for top-left (Settings) and top-right (Tasks) FABs ── */
#settings-fab, #todo-fab {
  position:fixed;top:16px;z-index:902;
  width:44px;height:44px;border-radius:50%;
  background:var(--g-bg);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
  border:1px solid var(--g-border);
  color:var(--g-ink);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .12s,transform .12s,color .12s;-webkit-tap-highlight-color:transparent;
}
#settings-fab { left:16px; }
#todo-fab { right:16px; }

#settings-fab:hover, #todo-fab:hover {background:var(--g-bg2)}
#settings-fab:active, #todo-fab:active {transform:scale(.94)}

/* ── Ambience panel — drops down from settings FAB (top-left) ── */
#amb-panel{
  position:fixed;z-index:901;
  top:66px;left:16px;
  transform:translateY(0) scale(1);
  width:min(280px,calc(100vw - 32px));
  transition:opacity .18s ease-out, transform .18s ease-out;
  transform-origin:top left;
  background:var(--g-bg);
  backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);
  border:1px solid var(--g-border);
  border-radius:20px;
  box-shadow:var(--g-shadow);
  padding:14px 16px 14px;
}
#amb-panel.hidden{
  opacity:0;pointer-events:none;
  transform:translateY(-8px) scale(.98);
}

/* ── Redesigned Todo panel — centered opaque card modal ── */
#todo-panel{
  position:fixed;z-index:901;
  left:50%;top:50%;transform:translate(-50%,-50%) scale(1);
  width:var(--bar-w);
  transition:opacity .18s ease-out, transform .18s ease-out;
  transform-origin:center center;
  max-height:min(500px,80vh);
  display:flex;flex-direction:column;gap:12px;
  background:#fbfaf9; /* Opaque solid off-white */
  border:none;
  border-radius:30px;
  box-shadow:0 30px 70px rgba(20,16,14,.16), 0 4px 14px rgba(20,16,14,.06);
  padding:24px;
}
#todo-panel.hidden{
  opacity:0;pointer-events:none;
  transform:translate(-50%,-50%) scale(.94);
}

/* ── Panel internals ── */
.ap-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ap-title{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:rgba(35,28,26,.42);text-transform:uppercase}
.ap-reset{
  width:26px;height:26px;border-radius:50%;padding:0;flex-shrink:0;
  background:var(--g-bg2);border:1px solid var(--g-border);
  color:rgba(35,28,26,.55);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .12s,color .12s,transform .18s;
}
.ap-reset:hover{background:rgba(255,255,255,.4);color:rgba(35,28,26,.85)}
.ap-reset:active{transform:rotate(-90deg)}

/* Compact control pill inside Ambience ── */
#ap-rows{display:flex;flex-direction:column;gap:8px}
.ap-row{
  display:flex;align-items:center;gap:10px;
  padding:9px 14px;border-radius:50px;
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.3);
}
.ap-lbl-text{
  width:90px;flex-shrink:0;
  font-family:var(--mono);font-size:11px;color:rgba(35,28,26,.75);
}
.ap-val{font-family:var(--mono);font-size:10px;color:rgba(35,28,26,.45);min-width:30px;text-align:right;flex-shrink:0}

/* Dot-track slider ── */
.ap-segs{display:flex;align-items:center;gap:7px;flex:1;height:20px;touch-action:none;-webkit-tap-highlight-color:transparent;cursor:pointer}
.ap-seg{
  width:5px;height:5px;border-radius:50%;flex-shrink:0;
  background:rgba(35,28,26,.22);
  transition:all .12s;
}
.ap-seg.peak{
  width:3px;height:17px;border-radius:2px;
  background:var(--seg-color,#e2935a);
  box-shadow:0 0 8px var(--seg-color,#e2935a);
}

/* Merged toggle row ── */
.ap-toggle-row{justify-content:space-between}
.ap-toggle-item{display:flex;align-items:center;gap:8px;flex:1;justify-content:center}
.ap-toggle-icon{font-size:14px;line-height:1}
.ap-row-divider{width:1px;height:20px;background:rgba(35,28,26,.14);flex-shrink:0}
.ap-toggle{
  width:32px;height:18px;border-radius:10px;
  background:rgba(35,28,26,.16);border:none;
  cursor:pointer;position:relative;flex-shrink:0;
  transition:background .18s;-webkit-tap-highlight-color:transparent;
}
.ap-toggle.on{background:#9fc3e8}
.ap-toggle-knob{
  position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
  background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);
  transition:transform .18s cubic-bezier(.4,0,.2,1);
}
.ap-toggle.on .ap-toggle-knob{transform:translateX(14px)}

/* ── Task Panel Header & List Redesign ── */
.td-panel-header {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-bottom: 12px;
  border-bottom: 1px solid rgba(0,0,0,.08);
}
.td-panel-title {
  font-family: var(--mono);
  font-size: 16px;
  font-weight: bold;
  color: rgba(35,28,26,.9);
}
.td-panel-meta {
  display: flex;
  justify-content: space-between;
  font-family: var(--mono);
  font-size: 11px;
  color: rgba(35,28,26,.5);
}

#todo-list {
  overflow-y: auto;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 8px;
  scrollbar-width: none; /* Hide scrollbars Firefox */
  -ms-overflow-style: none; /* Hide scrollbars IE/Edge */
}
#todo-list::-webkit-scrollbar {
  display: none; /* Hide scrollbars Chrome/Safari */
  width: 0;
  height: 0;
}

/* Redesigned flat list rows instead of individual cards ── */
.td-item{
  display:flex;align-items:center;gap:14px;padding:14px 2px;
  border-bottom:1px solid rgba(0,0,0,.07);
  cursor:pointer;
  background:none !important;
  backdrop-filter:none !important;
  border-radius:0 !important;
  border-top:none !important;
  border-left:none !important;
  border-right:none !important;
  transition:opacity .2s, background .2s;
  -webkit-tap-highlight-color:transparent;
}
.td-item:hover {
  background: rgba(0,0,0,0.01) !important;
}

/* Checkbox moved to order:3 (right-aligned) ── */
.td-check{
  order:3;
  width:20px;height:20px;border-radius:50%;
  border:2px solid rgba(0,0,0,.14);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  transition:all .22s;color:#fff;font-size:11px;
}
.td-item.done .td-check{
  background:#4bc766 !important; /* solid reference green */
  border-color:#4bc766 !important;
  color:#fff;
}

/* Done items: low visibility & dark warm line-through on hover ── */
.td-item.done{opacity:.5}
.td-item.done .td-text{
  text-decoration:line-through;
  text-decoration-thickness:1.5px;
  text-decoration-color:rgba(40,32,28,.5);
}
.td-item.done:hover{opacity:.8}
.td-item.done:hover .td-text{
  text-decoration-color:rgba(40,32,28,.75);
  color:rgba(40,32,28,.85);
}

/* Text and Date block ── */
.td-body{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0;order:1}
.td-text{font-family:var(--mono);font-size:12px;color:var(--g-ink);flex:1;word-break:break-word;line-height:1.4}
.td-date{font-family:var(--mono);font-size:10px;color:rgba(10,12,18,.55);letter-spacing:.02em}

/* Delete action button (order:2) - visible only on item hover ── */
.td-del{
  order:2;
  background:none;border:none;color:rgba(10,12,18,.3);font-size:15px;cursor:pointer;
  padding:3px 5px;flex-shrink:0;transition:color .12s, opacity .12s;
  -webkit-tap-highlight-color:transparent;
  opacity:0;
}
.td-item:hover .td-del{opacity:1}
.td-del:hover,.td-del:active{color:rgba(220,60,60,.9)}

/* Completed section collapse toggle ── */
.ap-completed-toggle{
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 16px;border-radius:50px;cursor:pointer;
  background:rgba(0,0,0,.04);border:1px solid rgba(0,0,0,.08);
  font-family:var(--mono);font-size:11px;color:rgba(35,28,26,.6);
  letter-spacing:.04em;transition:background .15s;
  -webkit-tap-highlight-color:transparent;
  margin-top: 4px;
}
.ap-completed-toggle:hover{background:rgba(0,0,0,.08)}
.ap-completed-toggle .chev{transition:transform .18s;display:inline-block}
.ap-completed-toggle.open .chev{transform:rotate(180deg)}

/* Footer "+ Add Task" row ── */
.td-add-row {
  border: 2px dashed rgba(35,28,26,.15);
  border-radius: 50px;
  padding: 12px;
  text-align: center;
  font-family: var(--mono);
  font-size: 12px;
  color: rgba(35,28,26,.6);
  cursor: pointer;
  transition: background .15s, border-color .15s, color .15s;
  margin-top: 8px;
}
.td-add-row:hover {
  background: rgba(35,28,26,.04);
  border-color: rgba(35,28,26,.3);
  color: rgba(35,28,26,.9);
}

/* ── Unified fully-rounded pill task input bar ── */
#task-bar{
  position:fixed;
  bottom:var(--bar-bot);
  left:50%;transform:translateX(-50%);
  width:var(--bar-w);
  background:var(--g-bg);
  backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);
  border:1px solid var(--g-border);
  border-radius:28px; /* Was 16px - stadium pill style */
  box-shadow:var(--g-shadow);
  display:flex;align-items:center;
  height:56px;padding:0 6px;
  z-index:900;
}
#task-input{
  height:100%;
  flex:1;background:none;border:none;outline:none;
  font-family:var(--mono);font-size:14px;
  color:rgba(35,28,26,.92); /* Dark warm contrast ink */
  caret-color:var(--g-green);
  padding:0 18px;-webkit-appearance:none;min-width:0;
}
#task-input::placeholder{color:rgba(35,28,26,.55);font-style:italic} /* Warm placeholder */
#task-submit{
  display:none;flex-shrink:0;width:34px;height:34px;
  border-radius:12px;background:rgba(35,28,26,.08); /* Flipped to dark warm */
  border:1px solid rgba(35,28,26,.3);color:rgba(35,28,26,.75);cursor:pointer;
  align-items:center;justify-content:center;
  transition:background .12s;margin-right:6px;
  -webkit-tap-highlight-color:transparent;
}
#task-submit:active{background:rgba(35,28,26,.15)}

/* ── Mobile Overrides ── */
@media (max-width:640px){
  :root{--bar-bot:max(20px,env(safe-area-inset-bottom,20px))}
  #task-bar{
    height:52px;
    border-radius:26px; /* Scaled stadium pill */
    padding:0 4px;
    width:calc(100vw - 32px); /* Extended full-width since FABs are gone from bottom */
    --bar-w:calc(100vw - 32px);
  }
  #task-input{font-size:16px;padding:0 12px}
  #task-submit{display:flex}
  #amb-panel{width:calc(100vw - 24px); top:64px; left:12px;}
  #settings-fab{top:14px;left:12px}
  #todo-fab{top:14px;right:12px}
  #todo-panel{width:calc(100vw - 24px); max-height:min(450px,75vh); padding:16px;}
  .td-item{padding:12px 2px}
  .td-check{width:22px;height:22px}
  .td-text{font-size:13px}
  #time-badge{font-size:9px;padding:4px 12px;max-width:calc(100vw - 120px)}
}

/* ── Tooltip ── */
#lamp-tooltip{
  position:fixed;pointer-events:none;z-index:999;
  background:rgba(255,255,255,.18);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);
  border:1px solid rgba(255,255,255,.3);border-radius:var(--r);
  padding:8px 13px;font-family:var(--mono);font-size:12px;color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.3);
  max-width:min(240px,72vw);line-height:1.5;
  box-shadow:0 4px 20px rgba(0,0,0,.18);transition:opacity .1s;
}
#lamp-tooltip.hidden{opacity:0}

/* ── Persistent tree labels ── */
.tree-label{
  position:fixed;z-index:998;pointer-events:none;
  transform:translate(-50%,-100%);
  background:rgba(255,255,255,.18);backdrop-filter:blur(12px) saturate(1.4);-webkit-backdrop-filter:blur(12px) saturate(1.4);
  border:1px solid rgba(255,255,255,.3);border-radius:8px;
  padding:5px 10px;font-family:var(--mono);font-size:11px;color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.3);
  white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis;
  box-shadow:0 4px 14px rgba(0,0,0,.18);
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="lamp-tooltip" class="hidden"></div>

<div id="time-badge">Loading…</div>

<!-- Settings FAB — Anchor top-left -->
<button id="settings-fab" title="Ambience settings">
  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/>
    <line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/>
    <line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/>
    <line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>
  </svg>
</button>

<div id="amb-panel" class="hidden">
  <div class="ap-head">
    <span class="ap-title">Ambience</span>
    <button class="ap-reset" id="ap-reset" title="Reset to defaults">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
    </button>
  </div>
  <div id="ap-rows"></div>
</div>

<!-- Redesigned modal card centered task panel -->
<div id="todo-panel" class="hidden">
  <div class="td-panel-header">
    <span class="td-panel-title">My Tasks</span>
    <div class="td-panel-meta">
      <span class="td-panel-date">📅 <span id="td-date-text"></span></span>
      <span class="td-panel-count" id="td-count-text">0 tasks</span>
    </div>
  </div>
  <div id="todo-list"></div>
  <div id="td-add-row" class="td-add-row">
    <span>+ Add Task</span>
  </div>
</div>

<div id="task-bar">
  <!-- Text input -->
  <input id="task-input" type="text" placeholder="plant a new task…" maxlength="120" autocomplete="off" spellcheck="false">
  <!-- Submit — mobile only -->
  <button id="task-submit" title="Add task">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12h14M12 5l7 7-7 7"/>
    </svg>
  </button>
</div>

<!-- Tasks icon button FAB — Anchor top-right -->
<button id="todo-fab" title="Tasks">
  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 12l5 5L22 4"/><path d="M2 19l5 5L22 11" opacity=".45"/>
  </svg>
</button>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/controls/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── Detect mobile ─────────────────────────────────────────────────────────────
const IS_MOBILE = window.innerWidth <= 768 || ('ontouchstart' in window);

// ── Renderer ──────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({
  canvas, antialias: !IS_MOBILE, powerPreference:'high-performance'
});
renderer.setPixelRatio(IS_MOBILE ? 1 : Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = false;  // shadows OFF entirely
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

window.addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight);
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
});

// ── Scene ─────────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color('#1a3a6a');
scene.fog = new THREE.FogExp2('#1a3a6a', 0.004);

// ── Camera ────────────────────────────────────────────────────────────────────
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.5, 400);
camera.position.set(0, 28, 62);

// ── Controls ──────────────────────────────────────────────────────────────────
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 3, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 71;
controls.maxDistance = 110;
controls.zoomSpeed = 0.17;
controls.maxPolarAngle = Math.PI * 0.52;
controls.update();

// ── Lighting — ONLY 2 lights total ───────────────────────────────────────────
const hemi = new THREE.HemisphereLight(0x6ab4f5, 0x3a6a30, 1.2);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff8e0, 1.6);
sun.position.set(60, 80, -40);
scene.add(sun);

// Warm night fill — mimics old-fashioned street-lamp ambient wash
const nightFill = new THREE.PointLight(0xffcc66, 0, 200);
nightFill.position.set(0, 18, 0);
scene.add(nightFill);
// Second fill from opposite angle for even coverage
const nightFill2 = new THREE.PointLight(0xffaa44, 0, 200);
nightFill2.position.set(-10, 14, -10);
scene.add(nightFill2);

// ── Ambience settings ─────────────────────────────────────────────────────────
const AMB = { brightness: 1.0, fogDensity: 1.0, rain: false, wind: false };
const FOG_BASE = 0.004;

// ── Terrain helpers ───────────────────────────────────────────────────────────
const terrain = new Map();
const getH = (x,z) => terrain.get(`${Math.round(x)},${Math.round(z)}`) ?? 0;

// ── Shared materials (reuse aggressively) ─────────────────────────────────────
const MAT = {
  grass1:  new THREE.MeshStandardMaterial({color:'#3c583a',emissive:'#1a2a18',emissiveIntensity:0}),
  grass2:  new THREE.MeshStandardMaterial({color:'#4a6946',emissive:'#1e2e1c',emissiveIntensity:0}),
  grass3:  new THREE.MeshStandardMaterial({color:'#2d422a',emissive:'#141e12',emissiveIntensity:0}),
  sand:    new THREE.MeshStandardMaterial({color:'#c8ad7a',emissive:'#6a5a30',emissiveIntensity:0}),
  stone:   new THREE.MeshStandardMaterial({color:'#7a7570',emissive:'#3a3530',emissiveIntensity:0,roughness:.95}),
  darkSt:  new THREE.MeshStandardMaterial({color:'#524e4a',emissive:'#28241e',emissiveIntensity:0,roughness:.98}),
  wood:    new THREE.MeshStandardMaterial({color:'#5a3820',emissive:'#2a1a0a',emissiveIntensity:0,roughness:.85}),
  red:     new THREE.MeshStandardMaterial({color:'#cc2200',emissive:'#660800',emissiveIntensity:0,roughness:.7}),
  darkRed: new THREE.MeshStandardMaterial({color:'#881500',emissive:'#440800',emissiveIntensity:0,roughness:.7}),
  iron:    new THREE.MeshStandardMaterial({color:'#2a2a2a',emissive:'#141414',emissiveIntensity:0,roughness:.7,metalness:.4}),
  bam:     new THREE.MeshStandardMaterial({color:'#5a8a30',emissive:'#243a10',emissiveIntensity:0,roughness:.8}),
  bamDark: new THREE.MeshStandardMaterial({color:'#3d6620',emissive:'#182a08',emissiveIntensity:0,roughness:.9}),

// ── Terrain generation ────────────────────────────────────────────────────────
function buildTerrain(){
  const SIZE = IS_MOBILE ? 32 : 38;
  // Simple noise function
  for(let x=-SIZE;x<=SIZE;x++) for(let z=-SIZE;z<=SIZE;z++){
    const d=Math.sqrt(x*x+z*z); if(d>SIZE) continue;
    const edge=Math.max(0,1-d/SIZE);
    const h=Math.floor(2+(Math.sin(x*.18)*2.8+Math.cos(z*.15)*2.2+Math.sin((x+z)*.09)*1.8)
      *edge*1.4 + Math.max(0,1-d/20)*14);
    terrain.set(`${x},${z}`,h);
  }

  const dummy=new THREE.Object3D(), box=new THREE.BoxGeometry(1,1,1);
  const buckets=[[],[],[],[]];
  for(const [key,h] of terrain){
    const [x,z]=key.split(',').map(Number);
    if(h<=1){ buckets[3].push({x,y:h/2,z,h}); continue; }
    buckets[Math.floor(Math.random()*3)].push({x,y:h/2,z,h});
  }
  [MAT.grass1,MAT.grass2,MAT.grass3,MAT.sand].forEach((mat,mi)=>{
    const pts=buckets[mi]; if(!pts.length) return;
    const mesh=new THREE.InstancedMesh(box,mat,pts.length);
    pts.forEach((p,i)=>{dummy.position.set(p.x,p.y,p.z);dummy.scale.set(1,p.h,1);dummy.updateMatrix();mesh.setMatrixAt(i,dummy.matrix);});
    mesh.instanceMatrix.needsUpdate=true;
    scene.add(mesh);
  });

  // Water ring
  const wBox=new THREE.BoxGeometry(1,.4,1);
  const wCells=[]; for(const [key,h] of terrain){ const [x,z]=key.split(',').map(Number); if(h<=1) wCells.push({x,z}); }
  if(wCells.length){
    const wMesh=new THREE.InstancedMesh(wBox,MAT.water,wCells.length);
    wCells.forEach(({x,z},i)=>{dummy.position.set(x,1.3,z);dummy.scale.set(.98,1,.98);dummy.updateMatrix();wMesh.setMatrixAt(i,dummy.matrix);});
    wMesh.instanceMatrix.needsUpdate=true; scene.add(wMesh);
  }
}

// ── Torii gate ────────────────────────────────────────────────────────────────
function createTorii(cx,cz,rotY=0,scale=1){
  const g=new THREE.Group();
  const postH=8;

  // Sample ground height under each post in world space
  const postOffsets=[-2.2,2.2];
  const postGroundY=postOffsets.map(lx=>{
    const wx=cx+lx*Math.cos(rotY);
    const wz=cz-lx*Math.sin(rotY);
    return Math.max(getH(wx,wz), getH(wx+1,wz), getH(wx-1,wz), getH(wx,wz+1), getH(wx,wz-1));
  });
  // Place group at the lower post ground so neither floats
  const baseY=Math.min(postGroundY[0],postGroundY[1]);

  postOffsets.forEach((lx,i)=>{
    const post=new THREE.Mesh(new THREE.CylinderGeometry(.28,.35,postH,7),MAT.red);
    post.position.set(lx,4,0); g.add(post);
    // Foot extends down to match local terrain difference
    const localGround=postGroundY[i]-baseY;
    const footH=0.5+localGround;
    const foot=new THREE.Mesh(new THREE.CylinderGeometry(.5,.5,footH,7),MAT.darkRed);
    foot.position.set(lx,localGround-footH/2+0.25,0); g.add(foot);
    // Sink post 1 unit into ground
    post.position.set(lx,4+localGround-1,0);
  });

  const kasagi=new THREE.Mesh(new THREE.BoxGeometry(7.2,.55,.7),MAT.darkRed); kasagi.position.y=7.3; g.add(kasagi);
  const shimagi=new THREE.Mesh(new THREE.BoxGeometry(5.8,.4,.55),MAT.red); shimagi.position.y=6.65; g.add(shimagi);
  const nuki=new THREE.Mesh(new THREE.BoxGeometry(5.2,.35,.4),MAT.red); nuki.position.y=4.5; g.add(nuki);
  g.scale.setScalar(scale);
  g.rotation.y=rotY;
  g.position.set(cx,baseY,cz);
  scene.add(g);
}

const TREE_POOL = [
  [14,8],[-8,-12],[18,-6],[-16,4],[6,-20],[22,16],[-20,-14],[4,18],
  [-10,20],[16,-18],[-24,6],[10,10],[-6,-18],[20,-14],[-14,12],[8,22],
];

const taskTrees = []; // { group, canopyMats, hitMesh, todo }

function spawnTaskTree(x, z, todo){
  const y = getH(x, z);
  const g = new THREE.Group();

  // Trunk
  const trunkMat = new THREE.MeshStandardMaterial({color: todo.done ? '#5a4020' : '#6b4a2a', roughness:.9});
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.18,.28,2.5,6), trunkMat);
  trunk.position.y = 1.25; g.add(trunk);

  // Canopy clouds — always pink blossom
  const canopyMats = [];
  const clouds = [[0,3.8,0,2.0],[1.1,3.2,.7,1.5],[-0.9,3.0,.5,1.3],[.35,4.3,-.5,1.7],[-1.2,3.4,-.7,1.2]];
  clouds.forEach(([bx,by,bz,r])=>{
    const mat = new THREE.MeshStandardMaterial({
      color:'#f4a0c0', emissive:'#e06080', emissiveIntensity:0.25, roughness:.9
    });
    canopyMats.push(mat);
    const cloud = new THREE.Mesh(new THREE.DodecahedronGeometry(r,0), mat);
    cloud.position.set(bx,by,bz); g.add(cloud);
  });

  // Invisible hit sphere — large, easy to hover
  const hitMesh = new THREE.Mesh(
    new THREE.SphereGeometry(2.2,6,6),
    new THREE.MeshBasicMaterial({visible:false})
  );
  hitMesh.position.y = 3.5; g.add(hitMesh);

  g.position.set(x, y, z);
  scene.add(g);

  const entry = { group:g, canopyMats, hitMesh, todo };
  hitMesh.userData.treeEntry = entry;
  taskTrees.push(entry);
  return entry;
}

// Flower colour palette — warm spring Japanese garden
const FLOWER_PALETTE = [
  {petal:'#f4a0c0',center:'#f0d060',emissive:'#e06080'}, // sakura pink
  {petal:'#d8a8e8',center:'#f0e060',emissive:'#b070d0'}, // lavender
  {petal:'#f8c060',center:'#f04040',emissive:'#d09020'}, // warm yellow
  {petal:'#f09070',center:'#f0d050',emissive:'#d06040'}, // coral
  {petal:'#a8c8f0',center:'#ffe860',emissive:'#6090d0'}, // periwinkle
  {petal:'#f0e0b0',center:'#e07030',emissive:'#c0b060'}, // cream
];

const taskFlowers = []; // { group }

function spawnTaskFlower(x, z, todo){
  const y = getH(x, z);
  const col = FLOWER_PALETTE[(todo.id || 0) % FLOWER_PALETTE.length];
  const g = new THREE.Group();

  const stemMat   = new THREE.MeshStandardMaterial({color:'#3a6020',emissive:'#182808',emissiveIntensity:0,roughness:.9});
  const petalMat  = new THREE.MeshStandardMaterial({color:col.petal, emissive:col.emissive, emissiveIntensity:.35, roughness:.8});
  const centerMat = new THREE.MeshStandardMaterial({color:col.center,emissive:col.center,  emissiveIntensity:.5,   roughness:.7});

  // Short stem
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(.025,.035,.38,5), stemMat);
  stem.position.y = .19; g.add(stem);

  // 5 petals radiating outward — flat oblate spheres
  const PETALS = 5;
  for(let i=0;i<PETALS;i++){
    const a = (i/PETALS)*Math.PI*2;
    const petal = new THREE.Mesh(new THREE.SphereGeometry(.14,5,4), petalMat);
    petal.scale.set(1,.32,1);
    petal.position.set(Math.cos(a)*.16, .41, Math.sin(a)*.16);
    g.add(petal);
  }

  // Slightly smaller second ring of petals, offset
  for(let i=0;i<PETALS;i++){
    const a = (i/PETALS)*Math.PI*2 + Math.PI/PETALS;
    const petal = new THREE.Mesh(new THREE.SphereGeometry(.1,5,4), petalMat);
    petal.scale.set(1,.28,1);
    petal.position.set(Math.cos(a)*.12, .44, Math.sin(a)*.12);
    g.add(petal);
  }

  // Centre dome
  const centre = new THREE.Mesh(new THREE.SphereGeometry(.1,6,5), centerMat);
  centre.scale.set(1,.7,1);
  centre.position.y = .47; g.add(centre);

  // Tiny leaf pairs at base
  const leafMat = new THREE.MeshStandardMaterial({color:'#4a7830',emissive:'#1a3010',emissiveIntensity:0,roughness:.88});
  for(let i=0;i<2;i++){
    const a = (i/2)*Math.PI + .4;
    const leaf = new THREE.Mesh(new THREE.SphereGeometry(.1,5,4), leafMat);
    leaf.scale.set(.5,.18,1);
    leaf.position.set(Math.cos(a)*.14,.14,Math.sin(a)*.14);
    leaf.rotation.y = a;
    g.add(leaf);
  }

  NIGHT_MATS.push(stemMat, leafMat);
  g.position.set(x, y, z);
  scene.add(g);
  taskFlowers.push({group:g});
}

function buildTaskTrees(){
  // Clear both trees and flowers
  taskTrees.forEach(t=>scene.remove(t.group));
  taskTrees.length = 0;
  taskFlowers.forEach(f=>scene.remove(f.group));
  taskFlowers.length = 0;

  const validPool = TREE_POOL.filter(([x,z])=> getH(x,z) > 2);

  todos.forEach((t, i)=>{
    if(i >= validPool.length) return;
    const seed = (t.id || i+1);
    const nx = validPool[i][0] + ((seed*7919)%100)/100 - 0.5;
    const nz = validPool[i][1] + ((seed*6271)%100)/100 - 0.5;
    if(getH(nx,nz) <= 2) return;
    if(t.done){
      spawnTaskFlower(nx, nz, t); // completed → small flower
    } else {
      spawnTaskTree(nx, nz, t);   // pending → full tree
    }
  });
  buildPersistentLabels(); // refresh labels
}

// ── Hover / tooltip ───────────────────────────────────────────────────────────
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let hoveredTree = null;
const tooltip = document.getElementById('lamp-tooltip');

// ── Persistent labels ────────────────────────────────────────────────────────
let labelsAlwaysOn = false;
const persistentLabels = []; // { el, entry }

function buildPersistentLabels(){
  // Remove old label elements
  persistentLabels.forEach(p=>p.el.remove());
  persistentLabels.length = 0;
  if(!labelsAlwaysOn) return;

  taskTrees.forEach(entry=>{
    const el = document.createElement('div');
    el.className = 'tree-label';
    el.textContent = '🌸 ' + entry.todo.text;
    document.body.appendChild(el);
    persistentLabels.push({el, entry});
  });
}

function updatePersistentLabelPositions(){
  if(!labelsAlwaysOn || persistentLabels.length===0) return;
  const v = new THREE.Vector3();
  persistentLabels.forEach(({el, entry})=>{
    v.set(entry.group.position.x, entry.group.position.y + 5.2, entry.group.position.z);
    v.project(camera);
    const behindCamera = v.z > 1;
    const x = (v.x*.5+.5)*innerWidth;
    const y = (-v.y*.5+.5)*innerHeight;
    if(behindCamera || x<-100 || x>innerWidth+100 || y<-100 || y>innerHeight+100){
      el.style.display='none';
    } else {
      el.style.display='block';
      el.style.left = x+'px';
      el.style.top  = y+'px';
    }
  });
}

function onPointerMove(e){
  if(labelsAlwaysOn){ tooltip.classList.add('hidden'); return; }
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  mouse.x = (clientX / innerWidth)  * 2 - 1;
  mouse.y = (clientY / innerHeight) * -2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(taskTrees.map(t=>t.hitMesh));

  if(intersects.length > 0){
    const entry = intersects[0].object.userData.treeEntry;
    if(entry !== hoveredTree){
      if(hoveredTree) setTreeHover(hoveredTree, false);
      hoveredTree = entry;
      setTreeHover(entry, true);
    }
    tooltip.style.left = (clientX + 14) + 'px';
    tooltip.style.top  = (clientY - 12) + 'px';
    tooltip.textContent = '🌸 ' + entry.todo.text;
    tooltip.classList.remove('hidden');
    canvas.style.cursor = 'pointer';
  } else {
    if(hoveredTree){ setTreeHover(hoveredTree, false); hoveredTree = null; }
    tooltip.classList.add('hidden');
    canvas.style.cursor = '';
  }
}

function setTreeHover(entry, on){
  entry.canopyMats.forEach(m=>{
    m.emissiveIntensity = on ? 0.7 : 0.25;
    m.emissive.set(on ? '#ff88bb' : '#e06080');
  });
}

window.addEventListener('mousemove', onPointerMove, {passive:true});
window.addEventListener('touchmove',  onPointerMove, {passive:true});

// ── Red lantern string (emissive only) ────────────────────────────────────────
const lanternGroups = []; // { group, pivotY, phase }

function createLanternString(ax,az,bx,bz,count=5,h=7){
  const postMat=new THREE.MeshStandardMaterial({color:'#2a2218',roughness:.8});
  const ropeMat=new THREE.MeshStandardMaterial({color:'#3a3020',roughness:.95});
  const ay=getH(ax,az)+h, by=getH(bx,bz)+h;

  const pts=[];
  for(let i=0;i<=count;i++){
    const t=i/count;
    const lx=ax+(bx-ax)*t, lz=az+(bz-az)*t;
    const sag=Math.sin(t*Math.PI)*2.8;
    const ly=ay+(by-ay)*t-sag;
    pts.push({x:lx, y:ly, z:lz});
  }

  [0,count].forEach(i=>{
    const {x,y,z}=pts[i];
    const gy=getH(x,z);
    const postH=Math.max(1.5,y-gy+.2);
    const post=new THREE.Mesh(new THREE.CylinderGeometry(.12,.15,postH,7),postMat);
    post.position.set(x,gy+postH/2,z); scene.add(post);
  });

  for(let i=0;i<count;i++){
    const a=pts[i], b=pts[i+1];
    const dx=b.x-a.x, dy=b.y-a.y, dz=b.z-a.z;
    const len=Math.sqrt(dx*dx+dy*dy+dz*dz);
    const rope=new THREE.Mesh(new THREE.CylinderGeometry(.022,.022,len,4),ropeMat);
    rope.position.set((a.x+b.x)/2,(a.y+b.y)/2,(a.z+b.z)/2);
    rope.quaternion.setFromUnitVectors(
      new THREE.Vector3(0,1,0),
      new THREE.Vector3(dx,dy,dz).normalize()
    );
    scene.add(rope);
  }

  for(let i=1;i<count;i++){
    const {x,y,z}=pts[i];
    const lg=new THREE.Group();
    const body=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.9,8),EMIT.lanternBody);
    body.position.y=-.95;
    const topC=new THREE.Mesh(new THREE.CylinderGeometry(.22,.38,.18,8),postMat); topC.position.y=-.41;
    const botC=new THREE.Mesh(new THREE.CylinderGeometry(.38,.22,.18,8),postMat); botC.position.y=-1.49;
    const glw=new THREE.Mesh(new THREE.SphereGeometry(.26,6,6),EMIT.lanternGlow); glw.position.y=-.95;
    const stringMat=new THREE.MeshStandardMaterial({color:'#2a2218',roughness:.9});
    const str_=new THREE.Mesh(new THREE.CylinderGeometry(.015,.015,.4,4),stringMat); str_.position.y=-.2;
    lg.add(body,topC,botC,glw,str_);
    lg.position.set(x,y,z);
    scene.add(lg);
    lanternGroups.push({group:lg, pivotY:y, phase:Math.random()*Math.PI*2});
  }
}

const bambooGroves = []; // { culmM, count, baseX:[], baseZ:[], baseY:[], baseH:[], phase:[] }

function createBambooGrove(cx,cz,count=IS_MOBILE?8:18){
  const culmG=new THREE.CylinderGeometry(.12,.15,7,5);
  const nodeG=new THREE.CylinderGeometry(.18,.18,.2,5);
  const dummy=new THREE.Object3D();
  const culmM=new THREE.InstancedMesh(culmG,MAT.bam,count);
  const nodeM=new THREE.InstancedMesh(nodeG,MAT.bamDark,count*2);

  const baseX=[],baseZ=[],baseY=[],baseH=[],phase=[];
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2, r=Math.random()*4.5;
    const x=cx+Math.cos(a)*r, z=cz+Math.sin(a)*r;
    const y=getH(x,z), h=5+Math.random()*3;
    baseX.push(x); baseZ.push(z); baseY.push(y); baseH.push(h);
    phase.push(Math.random()*Math.PI*2);
    dummy.position.set(x,y+h/2,z); dummy.scale.set(1,h/7,1);
    dummy.rotation.set((Math.random()-.5)*.1,Math.random()*Math.PI*2,(Math.random()-.5)*.1);
    dummy.updateMatrix(); culmM.setMatrixAt(i,dummy.matrix);
    [.35,.65].forEach((f,ni)=>{
      dummy.position.set(x,y+h*f,z); dummy.scale.setScalar(1); dummy.rotation.set(0,0,0);
      dummy.updateMatrix(); nodeM.setMatrixAt(i*2+ni,dummy.matrix);
    });
  }
  culmM.instanceMatrix.needsUpdate=nodeM.instanceMatrix.needsUpdate=true;
  scene.add(culmM,nodeM);

  bambooGroves.push({culmM, count, baseX, baseZ, baseY, baseH, phase});
}

let windSock = null;
function createWindSock(x,z){
  const y=getH(x,z);
  const group=new THREE.Group();

  const poleMat=new THREE.MeshStandardMaterial({color:'#5a3c20',roughness:.9});
  const ringMat=new THREE.MeshStandardMaterial({color:'#d8d4c8',roughness:.7});

  const stripeB=new THREE.MeshStandardMaterial({color:'#f0eee6',emissive:'#888278',emissiveIntensity:.1,roughness:.85});

  const pole=new THREE.Mesh(new THREE.CylinderGeometry(.06,.08,3.2,6),poleMat);

  ring.position.y=3.15; group.add(ring);

  const SEG_COUNT=5;
  const pivots=[];
  let parent=group;
  let attachY=3.15;
  for(let i=0;i<SEG_COUNT;i++){
    const t0=i/SEG_COUNT, t1=(i+1)/SEG_COUNT;
    const r0=.20*(1-t0*.65), r1=.20*(1-t1*.65);
    const segLen=.55;

    const pivot=new THREE.Group();
    pivot.position.y = (i===0) ? attachY : segLen;
    const segGeo=new THREE.CylinderGeometry(r1,r0,segLen,8,1,true);
    segGeo.translate(0,-segLen/2,0);
    const seg=new THREE.Mesh(segGeo, i%2===0?stripeA:stripeB);
    pivot.add(seg);
    parent.add(pivot);
    pivots.push(pivot);
    parent=pivot;
  }

  group.position.set(x,y,z);
  scene.add(group);
  windSock = {group, pivots};
}

// ── Rocks (instanced) ─────────────────────────────────────────────────────────
function createRocks(){
  const rockMat=new THREE.MeshStandardMaterial({color:'#7a7a72',roughness:.95});
  const geo=new THREE.DodecahedronGeometry(.6,0);
  const COUNT=IS_MOBILE?20:35;
  const dummy=new THREE.Object3D();
  const mesh=new THREE.InstancedMesh(geo,rockMat,COUNT);
  let placed=0;
  for(let attempt=0;attempt<400&&placed<COUNT;attempt++){
    const a=Math.random()*Math.PI*2, r=4+Math.random()*28;
    const x=Math.cos(a)*r, z=Math.sin(a)*r, y=getH(x,z);
    if(y<2) continue;
    const s=.4+Math.random()*.8;
    dummy.position.set(x,y+.1,z); dummy.scale.setScalar(s);
    dummy.rotation.set(Math.random()*Math.PI,Math.random()*Math.PI,Math.random()*Math.PI);
    dummy.updateMatrix(); mesh.setMatrixAt(placed++,dummy.matrix);
  }
  mesh.count=placed; mesh.instanceMatrix.needsUpdate=true;
  scene.add(mesh);
}

// ── Time of day ───────────────────────────────────────────────────────────────
function applyTime(){
  const now=new Date(), hour=now.getHours()+now.getMinutes()/60;
  let day; if(hour<5)day=0; else if(hour<7)day=(hour-5)/2; else if(hour<18)day=1; else if(hour<20)day=1-(hour-18)/2; else day=0;
  const night=1-day;
  const golden=Math.max(
    (hour>4.5&&hour<7.5)?Math.sin((hour-4.5)/3*Math.PI):0,
    (hour>17&&hour<21)?Math.sin((hour-17)/4*Math.PI):0
  );
  // Sky
  const sky=new THREE.Color().lerpColors(new THREE.Color('#0d1220'),new THREE.Color('#1a6ab0'),day);
  if(golden>.01) sky.lerp(new THREE.Color('#c04010'),golden*.7);
  scene.background=sky; scene.fog.color.copy(sky);
  
  // Warm amber tint at night (0.55), fully off during day
  const nightEmissive = night * 0.55;
  NIGHT_MATS.forEach(m => { m.emissiveIntensity = nightEmissive; });

  // Hemi — warm amber floor at night, strong enough to read ground voxels
  hemi.intensity = night * 2.2 + day * 1.8;
  const nightHemiCol = new THREE.Color('#4a3010');
  const dayHemiCol   = new THREE.Color('#6ab4f5');
  hemi.color.lerpColors(nightHemiCol, dayHemiCol, day);
  if(golden>.01) hemi.color.lerp(new THREE.Color('#ff6622'),golden*.6);
  hemi.groundColor.lerpColors(new THREE.Color('#3a2808'), new THREE.Color('#3a6a30'), day);
  // Sun
  sun.intensity=day*1.8+golden*.5;
  sun.color.lerpColors(new THREE.Color('#8899cc'),new THREE.Color('#fff8e0'),day);
  if(golden>.2) sun.color.lerp(new THREE.Color('#ff7700'),golden*.8);
  // Night fill — close to ground, warm streetlamp yellow
  nightFill.intensity = night * 4.5;
  nightFill.position.y = 18;
  nightFill2.intensity = night * 3.0;
  // Exposure — significantly brighter at night
  renderer.toneMappingExposure=(1.1 + day*.2) * AMB.brightness;

  // UI panel opacity — aggressive during day so text is always readable
  const panelAlpha = (0.16 + day * 0.14).toFixed(2);
  const barAlpha   = (0.16 + day * 0.14).toFixed(2);
  const panelBg = `rgba(255,255,255,${panelAlpha})`;
  const barBg   = `rgba(255,255,255,${barAlpha})`;
  
  const ambPanel = document.getElementById('amb-panel');
  if(ambPanel) ambPanel.style.background = panelBg;
  
  const taskBar = document.getElementById('task-bar');
  if(taskBar) taskBar.style.background = barBg;

  const badge=document.getElementById('time-badge');
  if(badge){
    const ts=now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    const tzShort=now.toLocaleTimeString([],{timeZoneName:'short'}).split(' ').pop();
    const dateStr=now.toLocaleDateString([],{weekday:'long',year:'numeric',month:'long',day:'numeric'});
    badge.textContent=dateStr+' · '+ts+' · '+tzShort;
  }
}

// ── Ambience panel — dot-track sliders, one pill per control ──────────────────
const SEGS_COUNT = 8;
const SLIDERS=[
  {key:'brightness', label:'Brightness', min:.2, max:2,  fmt:v=>Math.round(v*100)+'%', color:'#e2935a'},
  {key:'fogDensity',  label:'Fog',          min:.1, max:4,  fmt:v=>v.toFixed(1)+'×',      color:'#5a8fbf'},
];
const defaults={...AMB};
const apRows=document.getElementById('ap-rows');

function valToDotIndex(val,min,max){
  return Math.max(0, Math.min(SEGS_COUNT-1, Math.round(((val-min)/(max-min))*(SEGS_COUNT-1))));
}
function dotIndexToVal(idx,min,max){
  return min + (idx/(SEGS_COUNT-1))*(max-min);
}

SLIDERS.forEach(({key,label,min,max,fmt,color})=>{
  const row=document.createElement('div'); row.className='ap-row';
  const peakIdx = valToDotIndex(AMB[key],min,max);

  let segsHTML='';
  for(let i=0;i<SEGS_COUNT;i++){
    segsHTML+=`<div class="ap-seg${i===peakIdx?' peak':''}" data-i="${i}"></div>`;
  }

  row.innerHTML=`
    <span class="ap-lbl-text">${label}</span>
    <div class="ap-segs" id="segs-${key}" style="--seg-color:${color}">${segsHTML}</div>
    <span class="ap-val" id="v-${key}">${fmt(AMB[key])}</span>`;
  apRows.appendChild(row);

  const segsEl = row.querySelector('.ap-segs');

  function setFromClientX(clientX){
    const rect = segsEl.getBoundingClientRect();
    const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    const idx = Math.max(0, Math.min(SEGS_COUNT-1, Math.round(ratio * (SEGS_COUNT-1))));
    AMB[key] = dotIndexToVal(idx, min, max);
    document.getElementById('v-'+key).textContent = fmt(AMB[key]);
    [...segsEl.children].forEach((seg,i)=>{ seg.classList.toggle('peak', i === idx); });
    applyTime();
  }

  let dragging=false;
  segsEl.addEventListener('pointerdown', e=>{ dragging=true; segsEl.setPointerCapture(e.pointerId); setFromClientX(e.clientX); });
  segsEl.addEventListener('pointermove', e=>{ if(dragging) setFromClientX(e.clientX); });
  segsEl.addEventListener('pointerup',   ()=>{ dragging=false; });
  segsEl.addEventListener('pointercancel',()=>{ dragging=false; });
});

// Strip colours — pending are vivid, done are muted/grey
const STRIP_COLORS = [
  '#e8507a','#5ab4e8','#e8c84a','#7ad478','#c87ae8',
  '#e87850','#4ae8d4','#e8e87a','#d47ab4','#78a0e8',
];
const DONE_EMISSIVE = '#303030';
const stripMeshes = [];

function buildStrips(){
  stripMeshes.forEach(m=>tanzakuGroup.remove(m));
  stripMeshes.length = 0;

  const MAX = 10;
  const visible = todos.slice(0, MAX);
  const total = visible.length;

  visible.forEach((t, i)=>{
    const col = STRIP_COLORS[i % STRIP_COLORS.length];
    const mat = new THREE.MeshStandardMaterial({
      color: t.done ? '#888' : col,
      emissive: t.done ? DONE_EMISSIVE : col,
      emissiveIntensity: t.done ? 0.08 : 0.55,
      roughness: .8,
    });

    const spread = total > 1 ? (i/(total-1)) * 1.8 - 0.9 : 0;
    const seed = (t.id || i) % 100;
    const sway = (seed/100 - 0.5) * 0.18;
    const hang = 0.28 + (seed % 5) * 0.06;

    const strip = new THREE.Mesh(new THREE.BoxGeometry(.13,.48,.025), mat);
    strip.position.set(spread, 5.1 - hang, 0);
    strip.rotation.z = sway;

    const string = new THREE.Mesh(
      new THREE.CylinderGeometry(.008,.008, hang, 3),
      new THREE.MeshStandardMaterial({color:'#c8c0a0'})
    );
    string.position.set(spread, 5.1 - hang/2, 0);

    tanzakuGroup.add(string, strip);
    stripMeshes.push(string, strip);
  });
}

function buildTodoItemEl(t, i){
  const item = document.createElement('div');
  item.className = 'td-item' + (t.done?' done':'');
  const dateLabel = t.done && t.completedAt
    ? `Completed ${fmtDate(t.completedAt)}`

  item.innerHTML = `

    <div class="td-check">${t.done?'✓':''}</div>`;
    
  item.querySelector('.td-check').addEventListener('click',(e)=>{ e.stopPropagation(); todos[i].done=!todos[i].done; todos[i].completedAt=todos[i].done?Date.now():null; saveTodos(); renderTodos(); });

function renderTodos(){

  activeIdx.forEach(i=> list.appendChild(buildTodoItemEl(todos[i], i)));

    countLabel.textContent = `${openCount} ${openCount === 1 ? 'task' : 'tasks'}`;

  const dateLabel = document.getElementById('td-date-text');
  if(dateLabel){

  }
}

const PETAL_COUNT = IS_MOBILE ? 18 : 35;
const PETAL_CX = 3, PETAL_CZ = 0;
const PETAL_R  = 6;
const PETAL_TOP = getH(PETAL_CX, PETAL_CZ) + 14;
const PETAL_BOT = PETAL_TOP - 10;

const petalGeo = new THREE.PlaneGeometry(.22, .16);
const petalMat = new THREE.MeshStandardMaterial({
  color:'#f8b8d0', emissive:'#e06080', emissiveIntensity:.4,
  roughness:.9, side:THREE.DoubleSide,
  transparent:true, opacity:.88,
});
const petalMesh = new THREE.InstancedMesh(petalGeo, petalMat, PETAL_COUNT);
petalMesh.frustumCulled = false;
scene.add(petalMesh);

const petal = {
  x: new Float32Array(PETAL_COUNT),
  y: new Float32Array(PETAL_COUNT),
  z: new Float32Array(PETAL_COUNT),
  vx:new Float32Array(PETAL_COUNT),
  vz:new Float32Array(PETAL_COUNT),
  vy:new Float32Array(PETAL_COUNT),
  phase:new Float32Array(PETAL_COUNT),
  spin:new Float32Array(PETAL_COUNT),
  rot: new Float32Array(PETAL_COUNT),
};

const _petalDummy = new THREE.Object3D();
function resetPetal(i){
  const a = Math.random()*Math.PI*2, r = Math.random()*PETAL_R;
  petal.x[i] = PETAL_CX + Math.cos(a)*r;
  petal.z[i] = PETAL_CZ + Math.sin(a)*r;
  petal.y[i] = PETAL_TOP - Math.random()*2;
  petal.vx[i]= (Math.random()-.5)*.012;
  petal.vz[i]= (Math.random()-.5)*.012;
  petal.vy[i]= .018 + Math.random()*.014;
  petal.phase[i] = Math.random()*Math.PI*2;
  petal.spin[i]  = (Math.random()-.5)*.06;
  petal.rot[i]   = Math.random()*Math.PI*2;
}
for(let i=0;i<PETAL_COUNT;i++){
  resetPetal(i);
  petal.y[i] = PETAL_BOT + Math.random()*(PETAL_TOP-PETAL_BOT);
}

function tickPetals(elapsed){
  for(let i=0;i<PETAL_COUNT;i++){
    petal.y[i] -= petal.vy[i];
    petal.x[i] += petal.vx[i] + Math.sin(elapsed*.7+petal.phase[i])*.008;
    petal.z[i] += petal.vz[i] + Math.cos(elapsed*.5+petal.phase[i])*.006;
    petal.rot[i]+= petal.spin[i];
    if(petal.y[i] < PETAL_BOT) resetPetal(i);
    _petalDummy.position.set(petal.x[i], petal.y[i], petal.z[i]);
    _petalDummy.rotation.set(
      Math.sin(elapsed*.4+petal.phase[i])*.5,
      petal.rot[i],
      Math.cos(elapsed*.3+petal.phase[i])*.4
    );
    _petalDummy.scale.setScalar(.8+Math.sin(petal.phase[i])*.2);
    _petalDummy.updateMatrix();
    petalMesh.setMatrixAt(i, _petalDummy.matrix);
  }
  petalMesh.instanceMatrix.needsUpdate = true;
}

}
for(let i=0;i<RAIN_COUNT;i++){
  resetRain(i);
  rain.y[i] = RAIN_BOT + Math.random()*(RAIN_TOP-RAIN_BOT);
}

function tickRain(){
  if(!AMB.rain) return;
  for(let i=0;i<RAIN_COUNT;i++){
    rain.y[i] -= rain.vy[i];
    rain.x[i] += rain.vx[i];
    if(rain.y[i] < RAIN_BOT) resetRain(i);
    _rainDummy.position.set(rain.x[i], rain.y[i], rain.z[i]);
    _rainDummy.rotation.set(0.12, 0, 0);
    _rainDummy.scale.set(1, rain.len[i], 1);
    _rainDummy.updateMatrix();
    rainMesh.setMatrixAt(i, _rainDummy.matrix);
  }
  rainMesh.instanceMatrix.needsUpdate = true;
}

// ── Wind ──────────────────────────────────────────────────────────────────────
const WIND_DIR = new THREE.Vector2(0.85, 0.35).normalize();
const _windDummy = new THREE.Object3D();

function tickWind(elapsed){
  if(!AMB.wind) return;

  const gust = 0.55 + Math.sin(elapsed*.35)*.25 + Math.sin(elapsed*.9)*.12;

  bambooGroves.forEach(grove=>{
    const {culmM, count, baseX, baseZ, baseY, baseH, phase} = grove;
    for(let i=0;i<count;i++){
      const flutter = Math.sin(elapsed*5 + phase[i]) * 0.025;
      const lean = (0.16 * gust) + flutter;
      _windDummy.position.set(baseX[i], baseY[i] + baseH[i]/2, baseZ[i]);
      _windDummy.scale.set(1, baseH[i]/7, 1);
      _windDummy.rotation.set(lean*WIND_DIR.y, phase[i]*0.3, -lean*WIND_DIR.x);
      _windDummy.updateMatrix();
      culmM.setMatrixAt(i, _windDummy.matrix);
    }
    culmM.instanceMatrix.needsUpdate = true;
  });

  lanternGroups.forEach(({group, phase})=>{
    const swing = Math.sin(elapsed*1.4 + phase*0.15) * 0.3 * gust + 0.22*gust;
    group.rotation.x =  swing * WIND_DIR.y;
    group.rotation.z = -swing * WIND_DIR.x;
  });

  taskTrees.forEach(entry=>{
    const lean = 0.05 * gust;
    entry.group.rotation.x =  lean * WIND_DIR.y;
    entry.group.rotation.z = -lean * WIND_DIR.x;
  });

  if(windSock){
    const fill = Math.min(1, Math.max(0, gust*1.2));
    const windYaw = Math.atan2(WIND_DIR.x, WIND_DIR.y);
    windSock.group.rotation.y = windYaw;
    windSock.pivots.forEach((pivot,i)=>{
      const t=(i+1)/windSock.pivots.length;
      const targetAngle = THREE.MathUtils.lerp(Math.PI/2, 0.08, fill*Math.min(1,t*1.3));
      const flutter = Math.sin(elapsed*4.5 + i*1.3) * 0.06 * fill * t;
      pivot.rotation.x = targetAngle + flutter;
    });
  }
}

function resetWind(){
  bambooGroves.forEach(grove=>{
    const {culmM, count, baseX, baseZ, baseY, baseH, phase} = grove;
    for(let i=0;i<count;i++){
      _windDummy.position.set(baseX[i], baseY[i] + baseH[i]/2, baseZ[i]);
      _windDummy.scale.set(1, baseH[i]/7, 1);
      _windDummy.rotation.set(0, phase[i]*0.3, 0);
      _windDummy.updateMatrix();
      culmM.setMatrixAt(i, _windDummy.matrix);
    }
    culmM.instanceMatrix.needsUpdate = true;
  });
  lanternGroups.forEach(({group})=>{ group.rotation.x=0; group.rotation.z=0; });
  taskTrees.forEach(entry=>{ entry.group.rotation.x=0; entry.group.rotation.z=0; });
  if(windSock){
    windSock.pivots.forEach(pivot=>{ pivot.rotation.x = Math.PI/2; });
  }
}

// ── Animate ───────────────────────────────────────────────────────────────────
const clock = new THREE.Clock();
let frameN=0;
function animate(){
  requestAnimationFrame(animate);
  frameN++;
  if(IS_MOBILE && frameN%2!==0) return;
  const elapsed=clock.getElapsedTime();
  tickPetals(elapsed);
  tickRain();
  tickWind(elapsed);
  updatePersistentLabelPositions();
  scene.fog.density=FOG_BASE*AMB.fogDensity;
  controls.update();
  renderer.render(scene,camera);
}
animate();
</script>
